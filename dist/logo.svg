<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="120" fill="none">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="primaryTealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="60%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <linearGradient id="accentAmberGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Subtle Drop Elevation -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" flood-color="#0F766E" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- LOGOMARK SYMBOL -->
  <g transform="translate(20, 10)" filter="url(#subtleGlow)">
    <!-- Base Hex-Pillar (Left Spine) -->
    <path d="M 22 24 L 38 14 L 38 86 L 22 76 Z" fill="url(#primaryTealGrad)" />
    
    <!-- Upper Chamber: Knowledge & Budget Foundation -->
    <path d="M 44 18 L 74 18 C 86 18, 94 26, 94 38 C 94 48, 86 54, 74 54 L 44 54 Z" fill="none" stroke="url(#primaryTealGrad)" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Lower Chamber: Honeycomb Cell & Compounding Savings -->
    <path d="M 44 48 L 78 48 C 91 48, 100 56, 100 68 C 100 80, 91 88, 78 88 L 44 88 Z" fill="none" stroke="url(#primaryTealGrad)" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Dynamic NextGen Sting / Arrow Vector (Gold Accent) -->
    <path d="M 12 70 L 52 30 L 68 46 L 98 12" fill="none" stroke="url(#accentAmberGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 78 12 L 98 12 L 98 32" fill="none" stroke="url(#accentAmberGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Core Pollen/Seed Dot (Financial Focus Point) -->
    <circle cx="68" cy="46" r="4.5" fill="#FBBF24" />
  </g>

  <!-- TYPOGRAPHY (Geometric High-Legibility Sans-Serif) -->
  <g transform="translate(145, 72)">
    <text font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="44">
      <tspan fill="#0F172A" font-weight="800">Budget</tspan><tspan fill="#0D9488" font-weight="500">Basics</tspan>
    </text>
  </g>

  <!-- JURY SUB-BADGE / TAGLINE -->
  <g transform="translate(148, 92)">
    <text font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748B">
      FINANCIAL LITERACY FOR NEXTGEN LEARNERS
    </text>
  </g>
</svg>
